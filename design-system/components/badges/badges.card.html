<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5">
  <style>
    :root{--color-sage-50:#eef1e6;--color-sage-100:#dde3cf;--color-sage-200:#bccaa6;--color-sage-300:#98ab80;--color-sage-400:#6f8760;--color-sage-500:#5a7050;--color-sage-600:#475a40;--color-sage-700:#36462f;--color-sage-800:#232e1e;--color-cream:#f6f5ea;--color-paper:#fffef9;--color-line:#e8e6d4;--color-line-strong:#d9d6bf;--color-ink:#25291d;--color-ink-2:#555a47;--color-ink-3:#878b76;--font-sans:'Figtree',ui-sans-serif,system-ui,sans-serif;--font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
    :root{color-scheme:light;--color-base-100:#fffef9;--color-base-200:#f6f5ea;--color-base-300:#e8e6d4;--color-base-content:#25291d;--color-primary:#5a7050;--color-primary-content:#f6f5ea;--color-secondary:#555a47;--color-secondary-content:#f6f5ea;--color-accent:#d2925a;--color-accent-content:#25291d;--color-neutral:#25291d;--color-neutral-content:#f6f5ea;--color-info:#4f6b78;--color-info-content:#f6f5ea;--color-success:#5f7a4f;--color-success-content:#f6f5ea;--color-warning:#a8772e;--color-warning-content:#f6f5ea;--color-error:#a8503a;--color-error-content:#f6f5ea;--radius-selector:.375rem;--radius-field:.375rem;--radius-box:.75rem;--size-selector:.25rem;--size-field:.25rem;--border:1px;--depth:0;--noise:0}
    body{font-family:var(--font-sans);color:var(--color-ink)}
    body { margin: 0; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--color-ink-3); width: 80px; flex: none; }
    .sep { height: 1px; background: var(--color-line); margin: 2px 0; }
    .dot{width:6px;height:6px;border-radius:999px;background:currentColor;display:inline-block}
  </style>
</head>
<body>
  <div class="row">
    <span class="lbl">status</span>
    <span class="badge badge-success badge-soft"><span class="dot"></span>Active</span>
    <span class="badge badge-info badge-soft"><span class="dot"></span>Trial</span>
    <span class="badge badge-warning badge-soft"><span class="dot"></span>Paused</span>
    <span class="badge badge-error badge-soft"><span class="dot"></span>Bounced</span>
  </div>
  <div class="sep"></div>
  <div class="row">
    <span class="lbl">roles</span>
    <span class="badge badge-primary badge-soft">Chair</span>
    <span class="badge badge-primary badge-soft">Trip leader</span>
    <span class="badge badge-info badge-soft">Safeguarding officer</span>
    <span class="badge badge-neutral badge-soft">Member</span>
  </div>
</body>
</html>
