<!-- @dsCard group="Member App · Mobile" viewport="430x860" subtitle="Compose a club message at phone width" name="Compose (mobile)" -->
<!-- @startingPoint section="Member App · Mobile" subtitle="Member compose flow on a phone" viewport="430x860" -->
<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>Compose (mobile) · Memba</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5">

  <style>
    :root {
      --color-sage-50:#eef1e6; --color-sage-100:#dde3cf; --color-sage-200:#bccaa6;
      --color-sage-300:#98ab80; --color-sage-400:#6f8760; --color-sage-500:#5a7050;
      --color-sage-600:#475a40; --color-sage-700:#36462f; --color-sage-800:#232e1e;
      --color-cream:#f6f5ea; --color-paper:#fffef9; --color-line:#e8e6d4; --color-line-strong:#d9d6bf;
      --color-ink:#25291d; --color-ink-2:#555a47; --color-ink-3:#878b76;
      --font-sans:'Figtree',ui-sans-serif,system-ui,sans-serif;
      --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
      --dur-fast:100ms; --ease-out:cubic-bezier(0.22,0.61,0.36,1);
    }
    :root {
      color-scheme: light;
      --color-base-100:#fffef9; --color-base-200:#f6f5ea; --color-base-300:#e8e6d4; --color-base-content:#25291d;
      --color-primary:#5a7050; --color-primary-content:#f6f5ea;
      --color-secondary:#555a47; --color-secondary-content:#f6f5ea;
      --color-accent:#d2925a; --color-accent-content:#25291d;
      --color-neutral:#25291d; --color-neutral-content:#f6f5ea;
      --color-info:#4f6b78; --color-info-content:#f6f5ea;
      --color-success:#5f7a4f; --color-success-content:#f6f5ea;
      --color-warning:#a8772e; --color-warning-content:#f6f5ea;
      --color-error:#a8503a; --color-error-content:#f6f5ea;
      --radius-selector:0.375rem; --radius-field:0.375rem; --radius-box:0.75rem;
      --size-selector:0.25rem; --size-field:0.25rem; --border:1px; --depth:0; --noise:0;
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; padding:24px 12px; font-family:var(--font-sans);
           background:var(--color-sage-700); display:flex; justify-content:center; }
    .ph { width:390px; max-width:100%; background:var(--color-cream); border-radius:30px; overflow:hidden;
          box-shadow:0 12px 40px rgba(21,32,28,0.35); border:1px solid rgba(255,255,255,0.25); }
    .ph-nav { display:flex; align-items:center; gap:10px; padding:13px 16px; background:var(--color-sage-700); }
    .ph-nav__mark { width:30px; height:30px; border-radius:8px; background:rgba(255,255,255,0.15); display:grid; place-items:center; flex:none; }
    .ph-nav__mark svg { width:16px; height:16px; fill:none; stroke:#fff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; opacity:0.85; }
    .ph-nav__txt { flex:1; min-width:0; }
    .ph-nav__name { font-size:14px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ph-nav__sub  { font-size:11px; color:rgba(255,255,255,0.55); line-height:1; }
    .ph-nav__av   { width:32px; height:32px; border-radius:50%; background:var(--color-sage-400); display:grid; place-items:center; font-size:11px; font-weight:700; color:#fff; flex:none; }

    .ph-body { padding:16px 16px 28px; display:flex; flex-direction:column; gap:16px; }
    .back { display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--color-ink-3); text-decoration:none; }
    .back svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

    .eyebrow { font-size:11px; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:var(--color-ink-3); margin:6px 0 0; }
    .title { font-size:23px; font-weight:700; letter-spacing:-0.02em; line-height:1.15; color:var(--color-ink); margin:6px 0 0; }
    .club { font-size:12px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--color-sage-600); margin:8px 0 0; }

    /* recipient callout — sage/info soft (post-034: off the old sky-blue) */
    .callout { display:flex; gap:11px; align-items:flex-start; padding:13px; border-radius:13px;
               background:var(--color-sage-50); border:1px solid var(--color-sage-100); }
    .callout__ic { width:32px; height:32px; border-radius:50%; background:var(--color-paper); color:var(--color-sage-600);
                   display:grid; place-items:center; flex:none; box-shadow:inset 0 0 0 1px var(--color-sage-100); }
    .callout__ic svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .callout p { margin:0; font-size:13px; line-height:1.5; color:var(--color-ink-2); }
    .callout strong { color:var(--color-ink); font-weight:600; }

    .from-lab { font-size:13px; font-weight:600; color:var(--color-ink); margin:2px 0 7px; }
    .from { display:flex; align-items:center; gap:11px; padding:11px 13px; border:1px solid var(--color-line);
            border-radius:12px; background:var(--color-paper); }
    .from__av { width:34px; height:34px; border-radius:50%; background:var(--color-base-200); color:var(--color-sage-600);
                display:grid; place-items:center; font-size:11px; font-weight:700; flex:none; box-shadow:inset 0 0 0 1px var(--color-line); }
    .from__t strong { display:block; font-size:13.5px; font-weight:600; color:var(--color-ink); }
    .from__t span { display:block; font-size:11.5px; color:var(--color-ink-3); margin-top:1px; }

    .field { display:flex; flex-direction:column; gap:6px; }
    .field__lab { font-size:13px; font-weight:600; color:var(--color-ink); }
    .field .input, .field .textarea { width:100%; }
    .actions { display:flex; flex-direction:column; gap:10px; margin-top:4px; }
    .actions .btn { width:100%; }
  </style>
</head>
<body>
  <div class="ph">
    <div class="ph-nav">
      <div class="ph-nav__mark"><svg viewBox="0 0 24 24"><path d="M3 18 9 7l4 6 2-3 5 8z"/></svg></div>
      <div class="ph-nav__txt"><div class="ph-nav__name">Kootenay Alpine Club</div><div class="ph-nav__sub">Members</div></div>
      <div class="ph-nav__av">LT</div>
    </div>

    <div class="ph-body">
      <a class="back" href="#"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg> Club home</a>

      <header>
        <p class="eyebrow">New message</p>
        <h1 class="title">Send a message to all current members</h1>
        <p class="club">Kootenay Alpine Club</p>
      </header>

      <div class="callout">
        <span class="callout__ic"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 6.2a3 3 0 0 1 0 5.6"/></svg></span>
        <p>Before you send: this message will be emailed to <strong>all 142 current members</strong> of Kootenay Alpine Club. There is no list to pick.</p>
      </div>

      <div>
        <p class="from-lab">From</p>
        <div class="from">
          <span class="from__av">LT</span>
          <span class="from__t"><strong>Lou Thirgood (you)</strong><span>Sending as yourself</span></span>
        </div>
      </div>

      <div class="field">
        <label class="field__lab" for="subj">Subject</label>
        <input id="subj" class="input" placeholder="Example: Saturday trail day">
      </div>

      <div class="field">
        <label class="field__lab" for="body">Message</label>
        <textarea id="body" class="textarea" rows="6" placeholder="Write the message members should receive."></textarea>
      </div>

      <div class="actions">
        <button class="btn btn-primary">✈ Send to all current members</button>
        <button class="btn btn-soft">Cancel</button>
      </div>
    </div>
  </div>
</body>
</html>
