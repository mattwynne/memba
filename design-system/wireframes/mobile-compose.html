<!-- @dsCard group="Member App · Mobile" viewport="430x860" subtitle="Compose a club message at phone width" name="Compose (mobile)" -->
<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>Compose (mobile) · Memba</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="mobile.css">
  <style>
    /* Compose is a form screen: tinted grouped background + tighter body. */
    .ph-body { padding:16px 14px 28px; gap:22px; background:var(--color-sage-50); }
  </style>
</head>
<body>
  <div class="ph">
    <div class="ph-nav">
      <div class="ph-nav__mark"><svg viewBox="0 0 64 64" aria-label="Memba"><path d="M32 51 C32 43 32 36 32 18" fill="none" stroke="#f6f5ea" stroke-width="4.6" stroke-linecap="round"/><path d="M32 33 C40 32 46 26 48 16 C39 17.5 33 24 32 33 Z" fill="#f6f5ea"/><path d="M32 39 C25 38 20 32 19 23 C26 24.5 31 31 32 39 Z" fill="#f6f5ea"/><circle cx="32" cy="15" r="3.7" fill="#d2925a"/></svg></div>
      <div class="ph-nav__txt"><div class="ph-nav__name">Kootenay Alpine Club</div></div>
      <div class="ph-nav__av" title="Lou Thirgood">LT</div>
    </div>

    <div class="ph-body">
      <div class="compose-bar">
        <a class="back" href="#">Cancel</a>
        <button class="send" id="sendBtn" disabled data-comment-anchor="2ec2f88927-button">Send</button>
      </div>

      <header>
        <h1 class="title" data-comment-anchor="7afbaa43a4-h1">New message</h1>
      </header>

      <div class="group">
        <div class="row row--to">
          <span class="row__lab">To</span>
          <span class="row__val--wrap">All <strong>142 current members</strong></span>
        </div>
        <div class="row">
          <label class="row__lab" for="subj">Subject</label>
          <input id="subj" class="row__input" placeholder="Saturday trail day">
        </div>
      </div>

      <div class="group">
        <div class="row row--stack">
          <textarea id="body" class="row__area" rows="7" placeholder="Write the message members should receive."></textarea>
        </div>
      </div>

    </div>
  </div>

  <script>
    (function () {
      var subj = document.getElementById('subj');
      var body = document.getElementById('body');
      var send = document.getElementById('sendBtn');
      function sync() {
        send.disabled = !(subj.value.trim() && body.value.trim());
      }
      subj.addEventListener('input', sync);
      body.addEventListener('input', sync);
      sync();
    })();
  </script>
</body>
</html>
