<!--
  Custom club groups — INTERACTIVE PROTOTYPE (2026-09-12, discovery design).

  Single self-contained file. Everything is mocked in page memory: no network, no backend, no
  real email. Reload to reset. It exists so the agreed behaviour can be *felt* end to end;
  the per-surface specs are the templates in ../templates/club-group-*.html and the welcome
  email in ../emails/group-welcome.html — those are the hand-off documents, this is not.

  Entry: open this file, or ./index.html for the map of everything.
  Try:  1. as Alice → New group → "Board 2" (or a blank / duplicate name)
        2. Board → Members → Add member → Priya   (see Outbox: welcome email)
        3. switch to Eve → Board → Request access  (switch to Alice → Admin: the request)
        4. switch to Dan → Board → Members-only view → Add yourself
        5. as Bob → Board → Members → Remove Alice / Leave Board (last member case on Huts)

  Client-side state and JS here are prototype-only. In the app these are LiveView pages with
  URL-addressable state (ADR 0015 / 0023); do not copy this script.
-->

      <li><svg width="15" height="15" viewBox="0 0 512 512" aria-hidden="true" focusable="false"><path d="M383.8 351.7c2.5-2.5 105.2-92.4 105.2-92.4l-17.5-7.5c-10-4.9-7.4-11.5-5-17.4 2.4-7.6 20.1-67.3 20.1-67.3s-47.7 10-57.7 12.5c-7.5 2.4-10-2.5-12.5-7.5s-15-32.4-15-32.4-52.6 59.9-55.1 62.3c-10 7.5-20.1 0-17.6-10 0-10 27.6-129.6 27.6-129.6s-30.1 17.4-40.1 22.4c-7.5 5-12.6 5-17.6-5C293.5 72.3 255.9 0 255.9 0s-37.5 72.3-42.5 79.8c-5 10-10 10-17.6 5-10-5-40.1-22.4-40.1-22.4S183.3 182 183.3 192c2.5 10-7.5 17.5-17.6 10-2.5-2.5-55.1-62.3-55.1-62.3S98.1 167 95.6 172s-5 9.9-12.5 7.5C73 177 25.4 167 25.4 167s17.6 59.7 20.1 67.3c2.4 6 5 12.5-5 17.4L23 259.3s102.6 89.9 105.2 92.4c5.1 5 10 7.5 5.1 22.5-5.1 15-10.1 35.1-10.1 35.1s95.2-20.1 105.3-22.6c8.7-.9 18.3 2.5 18.3 12.5S241 512 241 512h30s-5.8-102.7-5.8-112.8 9.5-13.4 18.4-12.5c10 2.5 105.2 22.6 105.2 22.6s-5-20.1-10-35.1 0-17.5 5-22.5z"/></svg><span>Proudly hosted in Canada.</span></li>

<script>
(function () {
  'use strict';

  // ---------- mock data ----------
  var CLUB = { name: 'Kootenay Alpine Club', slug: 'kootenay-alpine', host: 'https://kootenay-alpine.clubs.memba.io' };
  var PEOPLE = {
    // No member-since / joined dates: the shared member_row contract (93df96ec0) shows
    // initials, name, a You marker and role badges only.
    alice: { id: 'alice', name: 'Alice Ahmed', initials: 'AA', email: 'alice@example.com', admin: true,  tint: 'var(--color-sage-300)' },
    bob:   { id: 'bob',   name: 'Bob Brennan', initials: 'BB', email: 'bob@example.com',   admin: false, tint: 'var(--color-sage-200)' },
    carol: { id: 'carol', name: 'Carol Chen',  initials: 'CC', email: 'carol@example.com', admin: false, tint: 'var(--color-sage-100)' },
    dan:   { id: 'dan',   name: 'Dan Delgado', initials: 'DD', email: 'dan@example.com',   admin: true,  tint: 'var(--color-sage-200)' },
    eve:   { id: 'eve',   name: 'Eve Ekwueme', initials: 'EE', email: 'eve@example.com',   admin: false, tint: 'var(--color-sage-100)' },
    priya: { id: 'priya', name: 'Priya Deol',  initials: 'PD', email: 'priya@example.com', admin: false, tint: 'var(--color-sage-200)' },
    theo:  { id: 'theo',  name: 'Theo Dubois', initials: 'TD', email: 'theo@example.com',  admin: false, tint: 'var(--color-sage-100)' }
  };
  var PERSONAS = ['alice', 'bob', 'carol', 'dan', 'eve'];
  var ALL = Object.keys(PEOPLE);

  var S = {
    persona: 'alice',
    groups: [
      { id: 'everyone', name: 'Everyone', slug: 'everyone', system: true,  members: ALL.slice() },
      { id: 'admin',    name: 'Admin',    slug: 'admin',    system: true,  members: ['alice', 'dan'] },
      { id: 'board',    name: 'Board',    slug: 'board',    system: false, members: ['alice', 'bob', 'carol'] },
      { id: 'trips',    name: 'Trips committee', slug: 'trips-committee', system: false, members: ['eve', 'priya', 'theo'] },
      { id: 'huts',     name: 'Huts & maintenance', slug: 'huts-maintenance', system: false, members: ['bob'] }
    ],
    convos: [
      { id: 'c1', group: 'everyone', subject: 'Goodsir traverse — approach road washed out', body: 'Route update — the forestry service closed the approach road after last week’s storm, so the original plan is off.', from: 'bob', date: '20 May', replies: [{ from: 'eve', text: 'Happy to move it a week.', time: '20 May, 3:10pm' }] },
      { id: 'c2', group: 'board', subject: 'AGM agenda — final call for motions before we send it out', body: 'Two motions in so far: the hut levy and the instructor reimbursement rate. Anything else needs to be with me by Friday to make the printed agenda.', from: 'alice', date: '28 Aug', replies: [{ from: 'bob', text: 'Add the winter hut booking policy — I’ll write it up tonight.', time: '28 Aug, 9:14am' }, { from: 'carol', text: 'Nothing more from me.', time: '28 Aug, 10:02am' }] },
      { id: 'c3', group: 'board', subject: 'Insurance renewal quote came in 14% higher', body: 'Broker’s suggesting we raise the deductible to hold the premium flat. Worth a look before the AGM.', from: 'bob', date: '21 Aug', replies: [] },
      { id: 'c4', group: 'admin', subject: 'Renewal reminders — who’s chasing the lapsed ones?', body: 'Eleven memberships lapse at the end of the month. I’ll take A–M if someone takes the rest.', from: 'dan', date: '4 Sep', replies: [{ from: 'alice', text: 'I’ll take N–Z.', time: '4 Sep, 6:40pm' }] },
      { id: 'c5', group: 'trips', subject: 'Kokanee Glacier weekend — carpool list', body: 'Three cars so far. Reply with your seat count.', from: 'priya', date: '30 Aug', replies: [] }
    ],
    outbox: [],
    ui: { tab: 'conversations', picker: false, pickQuery: '', confirm: null, busy: null, flash: null, request: {}, formError: null, formName: '', formTouched: false, newConvoError: null }
  };

  var nextId = 100;
  function uid(p) { return p + (nextId++); }
  function me() { return PEOPLE[S.persona]; }
  function group(id) { for (var i = 0; i < S.groups.length; i++) if (S.groups[i].id === id) return S.groups[i]; return null; }
  function isMember(g, pid) { return g.members.indexOf(pid) !== -1; }
  function address(g) { return g.slug + '@' + CLUB.slug + '.clubs.memba.io'; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function slugify(name) { return name.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 32).replace(/-+$/, ''); }
  function uniqueSlug(base) { var s = base, n = 2; while (S.groups.some(function (g) { return g.slug === s; })) { s = base + '-' + n; n++; } return s; }
  function normName(n) { return n.trim().toLowerCase(); }
  // One rule for live feedback AND submit: blank / duplicate (case + outer-space insensitive) are
  // name errors; a distinct name whose slug collides is valid and gets the same suffix the
  // creation step stores. The slug is generated once at creation and stored separately.
  function checkName(name) {
    var trimmed = name.trim(), r = { trimmed: trimmed, error: null, base: null, slug: null, address: null, takenBy: null };
    if (!trimmed) { r.error = 'Give the group a name.'; return r; }
    var ex = null; S.groups.forEach(function (g) { if (!ex && normName(g.name) === normName(trimmed)) ex = g; });
    if (ex) { r.error = 'There’s already a group called “' + esc(ex.name) + '” in ' + CLUB.name + '. Pick a different name.'; return r; }
    r.base = slugify(trimmed) || 'group'; r.slug = uniqueSlug(r.base); r.address = r.slug + '@' + CLUB.slug + '.clubs.memba.io';
    if (r.slug !== r.base) S.groups.forEach(function (g) { if (!r.takenBy && g.slug === r.base) r.takenBy = g; });
    return r;
  }
  // Patches the New group form in place (no re-render, so focus and caret survive typing).
  function patchNewForm() {
    var inp = document.getElementById('gname'); if (!inp) return;
    var c = checkName(S.ui.formName), showErr = !!(S.ui.formTouched && c.error);
    var msg = document.getElementById('gname-msg'), out = document.getElementById('gname-addr'), note = document.getElementById('gname-addr-note'), btn = document.getElementById('gcreate');
    inp.classList.toggle('input-error', showErr);
    if (showErr) inp.setAttribute('aria-invalid', 'true'); else inp.removeAttribute('aria-invalid');
    msg.className = showErr ? 'field__error' : 'field__hint';
    msg.innerHTML = showErr ? c.error : 'Must be different from the club’s other groups (' + esc(S.groups.map(function (g) { return g.name; }).join(', ')) + ').';
    out.textContent = c.address || ''; out.classList.toggle('is-empty', !c.address);
    note.hidden = !c.takenBy; note.innerHTML = c.takenBy ? '“' + c.base + '” is already used by ' + esc(c.takenBy.name) + ', so this address gets a number.' : '';
    if (btn && S.ui.busy !== 'create') btn.disabled = showErr;
  }
  function now() { return 'just now'; }

  // simulated server round-trip: ~600ms. Infrastructure/system failures are deliberately not
  // modelled here: the app's existing generic error handling covers them (scope decision, Matt).
  function simulate(fn) {
    setTimeout(function () { fn(); render(); }, 600);
  }

  // ---------- routing ----------
  function route() {
    var h = location.hash.replace(/^#\/?/, '');
    var p = h.split('/');
    if (p[0] === 'new') return { view: 'new' };
    if (p[0] === 'outbox') return { view: 'outbox' };
    if (p[0] === 'g' && p[1]) {
      if (p[2] === 'members') return { view: 'group', gid: p[1], tab: 'members' };
      if (p[2] === 'c' && p[3]) return { view: 'convo', gid: p[1], cid: p[3] };
      if (p[2] === 'compose') return { view: 'compose', gid: p[1] };
      return { view: 'group', gid: p[1], tab: 'conversations' };
    }
    return { view: 'group', gid: 'everyone', tab: 'conversations' };
  }
  function go(h) { if (location.hash === '#' + h) render(); else location.hash = h; }
  window.addEventListener('hashchange', function () { S.ui.picker = false; S.ui.confirm = null; S.ui.formError = null; S.ui.formTouched = false; S.ui.justAdded = null; S.ui.sent = null; S.ui.newConvoError = null; render(); });

  // ---------- rendering ----------
  function globalBar() {
    var m = me();
    return '<div class="global-bar"><div class="global-bar__inner global-bar__inner--wide"><div class="global-bar__brand">' +
      '<svg class="global-bar__mark" viewBox="0 0 64 64" role="img" aria-label="Memba"><path d="M32 51 C32 43 32 36 32 18" fill="none" stroke="var(--color-cream)" stroke-width="4.8" stroke-linecap="round"/><path d="M32 33 C40 32 46 26 48 16 C39 17.5 33 24 32 33 Z" fill="var(--color-cream)"/><path d="M32 39 C25 38 20 32 19 23 C26 24.5 31 31 32 39 Z" fill="var(--color-cream)"/><circle cx="32" cy="15" r="3.7" fill="var(--color-accent, #d2925a)"/></svg><span class="global-bar__word">Memba</span></div>' +
      '<details class="dropdown dropdown-end global-bar__id"><summary id="club-site-identity-menu-button" class="global-bar__me" aria-controls="club-site-identity-menu" aria-label="Member identity menu"><span class="global-bar__avatar">' + m.initials + '</span></summary>' +
      '<div id="club-site-identity-menu" class="dropdown-content app-menu app-menu--id"><div class="app-menu__who"><div class="app-menu__who-name">' + esc(m.name) + '</div><div class="app-menu__who-email">' + esc(m.email) + '</div></div><div class="app-menu__divider" aria-hidden="true"></div><a class="app-menu__item" href="#" onclick="return false">Account settings</a><button class="app-menu__signout" type="button">Sign out</button></div></details></div></div>';
  }
  var LOCK = '<svg class="group-rail__lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span class="visually-hidden">(not a member)</span>';

  function rail(activeId) {
    var m = me(), mine = [], other = [];
    S.groups.forEach(function (g) { (isMember(g, m.id) ? mine : other).push(g); });
    function item(g, locked) {
      var on = g.id === activeId;
      return '<a class="group-rail__item' + (on ? ' is-active' : '') + '" href="#/g/' + g.id + '"' + (on ? ' aria-current="page"' : '') + (locked ? ' title="You’re not in this group"' : '') + '><span class="group-rail__name">' + esc(g.name) + '</span>' + (locked ? LOCK : '') + '</a>';
    }
    var h = '<nav class="group-rail" aria-label="Groups"><div class="group-rail__label">Your groups</div>' + mine.map(function (g) { return item(g, false); }).join('');
    if (other.length) h += '<div class="group-rail__label">Other groups</div>' + other.map(function (g) { return item(g, true); }).join('');
    if (m.admin) h += '<div class="group-rail__divider"></div><a class="group-rail__item group-rail__add" href="#/new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="group-rail__name">New group</span></a>';
    return h + '</nav>';
  }

  function shell(inner, wide) {
    return globalBar() + '<div class="app-card' + (wide ? ' app-card--wide' : '') + '"><div class="app-bar"><div class="app-bar__brand"><span class="app-bar__club">' + CLUB.name + '</span></div></div>' + inner + '</div>';
  }
  // A flash stays up while the same route re-renders (picker toggles, confirmations) and
  // clears on the next navigation. go() renders synchronously AND fires hashchange, so a
  // consume-on-render flash would vanish before anyone saw it.
  function flash() {
    var f = S.ui.flash; if (!f) return '';
    if (f.hash && f.hash !== location.hash) { S.ui.flash = null; return ''; }
    f.hash = location.hash;
    return '<div class="alert alert-' + f.kind + ' flash" role="' + (f.kind === 'error' ? 'alert' : 'status') + '"><span>' + f.text + '</span></div>';
  }
  function count(n) { return n === 1 ? '1 member' : n + ' members'; }

  function groupPage(r) {
    var g = group(r.gid); if (!g) { go('g/everyone'); return ''; }
    var m = me(), member = isMember(g, m.id);
    var head, body;

    if (!member && !m.admin) {
      // A. regular member outside a custom or system group: placeholder, no tabs
      head = '<header class="group-head"><div class="group-head__top"><div style="min-width:0"><h1 class="group-head__name">' + esc(g.name) + '</h1><div class="group-head__meta"><span>' + (g.system ? 'System group' : 'Private group') + ' · you’re not a member</span></div></div></div></header>';
      body = accessCard(g);
      return shell('<div class="club-groups"><div class="app-split">' + rail(g.id) + '<div class="group-content">' + flash() + head + body + '</div></div></div>', true);
    }

    var tab = r.tab;
    if (!member && m.admin && !g.system) tab = 'members'; // B. admin outside: Members only
    var meta = (g.system ? '' : 'Private group · ') + count(g.members.length) + (member ? '' : ' · you’re not a member');
    head = '<header class="group-head"><div class="group-head__top"><div style="min-width:0"><h1 class="group-head__name">' + esc(g.name) + '</h1><div class="group-head__meta" aria-label="Group details"><span>' + meta + '</span>' +
      (member && !g.system ? '<span class="group-head__you"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg>You’re a member</span>' : '') +
      '<a class="group-head__addr" href="mailto:' + address(g) + '">' + address(g) + '</a></div></div></div></header>';
    // Header owns metadata only (e6d3c38de). The active tab's single action lives in
    // section-tabs__action, mirroring MemberDashboardGroupTabs.group_tabs slots.

    function tabLink(id, label, href) {
      var on = tab === id;
      return '<a id="member-section-tab-' + id + '" class="section-tab' + (on ? ' is-active' : '') + '" role="tab" data-tab="' + id + '" aria-selected="' + on + '" aria-controls="member-section-panel-' + id + '" tabindex="' + (on ? '0' : '-1') + '" href="' + href + '">' + label + '</a>';
    }
    var action = '';
    if (tab === 'conversations') action = '<a class="btn btn-primary btn-sm" href="#/g/' + g.id + '/compose">New message</a>';
    else if (!g.system) action = '<button class="btn btn-primary btn-sm" type="button" data-act="picker" aria-expanded="' + S.ui.picker + '" aria-controls="member-picker">Add member</button>';
    else if (g.id === 'everyone' && m.admin) action = '<button class="btn btn-primary btn-sm" type="button" disabled title="Club invitations: existing flow, out of scope here">Invite member</button>';
    var tabs = '<div id="member-section-tabs" class="section-tabs"><div id="member-section-tabs-list" class="section-tabs__list" role="tablist" aria-label="Group sections" aria-orientation="horizontal">' +
      (member ? tabLink('conversations', 'Conversations', '#/g/' + g.id) : '') +
      tabLink('members', 'Members', '#/g/' + g.id + '/members') + '</div>' +
      '<div id="member-section-tabs-action" class="section-tabs__action">' + action + '</div></div>';

    body = '<div id="member-section-panel-' + tab + '" role="tabpanel" aria-labelledby="member-section-tab-' + tab + '">' + (tab === 'members' ? membersPanel(g) : convosPanel(g)) + '</div>';
    return shell('<div class="club-groups"><div class="app-split">' + rail(g.id) + '<div class="group-content">' + flash() + head + tabs + body + '</div></div></div>', true);
  }

  function accessCard(g) {
    var st = S.ui.request[g.id + ':' + S.persona] || 'idle';
    var actions;
    if (st === 'sending') actions = '<button class="btn btn-primary" type="button" disabled><span class="loading loading-spinner loading-xs" aria-hidden="true"></span> Sending your request…</button>';
    else if (st === 'sent') actions = '<p class="access__status access__status--sent" role="status">Your request went to the club admins.<small>Nothing has changed yet. If they add you to ' + esc(g.name) + ', you’ll get a welcome email with a link and this page will show its conversations.</small></p><button class="btn btn-ghost btn-sm" type="button" data-act="request" data-gid="' + g.id + '">Send another request</button>';
    else actions = '<button class="btn btn-primary" type="button" data-act="request" data-gid="' + g.id + '">Request access</button><p class="access__status">Sends a short note to the club admins saying you’d like to join ' + esc(g.name) + '.</p>';
    var who = g.system ? 'Only club admins are in Admin.' : 'You’re a member of ' + CLUB.name + ', but not of ' + esc(g.name) + '.';
    return '<section class="access" aria-labelledby="access-title"><div class="access__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div><h2 id="access-title" class="access__title">' + esc(g.name) + ' is a private group</h2>' +
      '<p class="access__copy">Only people in ' + esc(g.name) + ' can read its conversations, get its emails, or see who’s in it. ' + who + '</p>' +
      (g.system ? '' : '<p class="access__copy">Think you should be? Ask the club admins — any ' + esc(g.name) + ' member or club admin can add you.</p><div class="access__actions">' + actions + '</div>') +
      '<p class="access__admin">' + (g.system ? 'Email the admins: ' : 'Or email them yourself: ') + '<a href="mailto:admin@' + CLUB.slug + '.clubs.memba.io">admin@' + CLUB.slug + '.clubs.memba.io</a></p></section>';
  }

  function convosPanel(g) {
    var list = S.convos.filter(function (c) { return c.group === g.id; });
    if (!list.length) return '<div class="section-panel"><p class="empty-convos"><strong>No ' + esc(g.name) + ' conversations yet.</strong> Start one with New message, or email ' + address(g) + '.</p></div>';
    return '<div class="section-panel"><div class="conversation-list">' + list.map(function (c) {
      // Mirrors conversation_row + participant_avatar_stack (93df96ec0): subject, date,
      // preview, Started by, participant avatars (+overflow), reply activity.
      var p = PEOPLE[c.from], last = c.replies.length ? PEOPLE[c.replies[c.replies.length - 1].from].name : null;
      var parts = [c.from]; c.replies.forEach(function (rp) { if (parts.indexOf(rp.from) === -1) parts.push(rp.from); });
      var shown = parts.slice(0, 3), more = parts.length - shown.length;
      var stack = '<div class="avatar-stack" aria-label="Conversation participants">' + shown.map(function (pid) { return '<span title="' + esc(PEOPLE[pid].name) + '">' + PEOPLE[pid].initials + '</span>'; }).join('') + (more > 0 ? '<span class="is-more" aria-label="' + more + ' more participants">+' + more + '</span>' : '') + '</div>';
      return '<article data-message-id="' + c.id + '"><a class="conversation" href="#/g/' + g.id + '/c/' + c.id + '"><div class="conversation__avatar" style="background:' + p.tint + '">' + p.initials + '</div><div class="conversation__body"><div class="conversation__head"><span class="conversation__subject">' + esc(c.subject) + '</span><span class="conversation__date">' + c.date + '</span></div><div class="conversation__preview">' + esc(c.body) + '</div><span class="conversation__replies">Started by ' + esc(p.name) + (c.auto ? ' · sent automatically' : '') + '</span><div class="conversation__participants">' + stack + '<span class="conversation__replies">' + (c.replies.length ? '<strong>' + c.replies.length + (c.replies.length === 1 ? ' reply' : ' replies') + '</strong> · latest from ' + esc(last) : 'No replies yet') + '</span></div></div></a></article>';
    }).join('') + '</div></div>';
  }

  function membersPanel(g) {
    var m = me(), member = isMember(g, m.id), h = '<div class="section-panel">';
    if (g.system) {
      h += '<p class="members-note">' + (g.id === 'everyone' ? 'Everyone in ' + CLUB.name + ' is in this group automatically.' : 'Admin membership follows the club admin role — it isn’t managed here.') + '</p><div class="member-list">' + g.members.map(function (pid) { return row(g, pid, false); }).join('') + '</div></div>';
      return h;
    }
    if (!member) {
      var busy = S.ui.busy === 'self:' + g.id;

  function row(g, pid, manageable) {

  function convoPage(r) {

    var c = null; S.convos.forEach(function (x) { if (x.id === r.cid) c = x; });
    if (!c) { go('g/' + g.id); return ''; }
    var p = PEOPLE[c.from];
    var msgs = '<div class="message message--original" style="margin-top:16px"><div class="message__avatar" style="background:' + p.tint + '">' + p.initials + '</div><div class="message__body"><div class="message__head"><span class="message__name">' + esc(p.name) + '</span><span class="message__time">' + c.date + '</span>' + (c.auto ? '<span class="message__tag badge badge-soft">Sent automatically</span>' : '') + '</div><div class="message__text">' + (c.auto ? c.html : esc(c.body)) + '</div>' + (c.auto ? '<div style="margin-top:12px"><a class="btn btn-primary btn-sm" href="#/g/' + c.auto + '/members">Manage ' + esc(group(c.auto).name) + ' members</a></div>' : '') + '</div></div>';
    msgs += c.replies.map(function (rp) { var q = PEOPLE[rp.from]; return '<div class="message"><div class="message__avatar" style="background:' + q.tint + '">' + q.initials + '</div><div class="message__body"><div class="message__head"><span class="message__name">' + esc(q.name) + '</span><span class="message__time">' + rp.time + '</span></div><div class="message__text">' + esc(rp.text) + '</div></div></div>'; }).join('');

      '<form class="composer" id="replyForm" data-cid="' + c.id + '"><div class="composer__head"><span class="composer__title">Reply</span><span class="composer__as">Replying as <strong>' + esc(m.name) + '</strong></span></div>' + note + '<textarea class="textarea" rows="3" name="text" placeholder="Write a reply…"></textarea>' + (S.ui.newConvoError ? '<p class="composer__error" role="alert">' + S.ui.newConvoError + '</p>' : '') + '<div class="composer__actions"><button class="btn btn-primary" type="submit">Post reply</button></div></form></div>', false);

  function outboxPage() {
    var h = '<div class="outbox"><a class="app-back" href="#/g/everyone"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg> Back</a><h1 class="page-title">Mock outbox</h1><p class="page-intro">Every email this prototype <em>would</em> have sent. Nothing here left the page. Welcome emails are the design in ../emails/group-welcome.html; access requests reach admins as ordinary group-message emails.</p>';
    if (!S.outbox.length) h += '<p class="empty-convos">Nothing sent yet. Add someone to a group, or request access as Eve.</p>';
    else h += S.outbox.slice().reverse().map(function (e) { return '<div class="mail"><div class="mail__meta"><span>to: ' + esc(e.to) + '</span><span>from: ' + esc(e.from) + '</span><span>' + esc(e.kind) + '</span></div><div class="mail__subject">' + esc(e.subject) + '</div><p class="mail__body">' + esc(e.body) + '</p>' + (e.link ? '<div class="mail__link"><a href="' + e.link + '">' + esc(e.linkText) + '</a></div>' : '') + '</div>'; }).join('');

  function render() {
    var r = route(), html;
    if (r.view === 'new') html = newGroupPage();
    else if (r.view === 'compose') html = composePage(r);
    else if (r.view === 'convo') html = convoPage(r);
    else if (r.view === 'outbox') html = outboxPage();
    else html = groupPage(r);
    if (html === '') return; // a redirect happened
    var app = document.getElementById('app');
    app.innerHTML = html;
    document.getElementById('who').innerHTML = PERSONAS.map(function (pid) { var p = PEOPLE[pid]; return '<button type="button" data-persona="' + pid + '" aria-pressed="' + (pid === S.persona) + '">' + p.name.split(' ')[0] + (p.admin ? ' (admin)' : '') + '</button>'; }).join('');
    document.getElementById('outboxCount').textContent = S.outbox.length;
    patchNewForm();
    if (S.ui.focusTab) { var ft = document.getElementById('member-section-tab-' + S.ui.focusTab); if (ft) ft.focus(); S.ui.focusTab = null; }
    var q = document.getElementById('pick-search'); if (q && S.ui.pickerFocus) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); S.ui.pickerFocus = false; }
    var f = app.querySelector('.field__error, .alert-error'); if (f && S.ui.focusError) { var inp = app.querySelector('.input-error') || f; inp.focus && inp.focus(); S.ui.focusError = false; }
  }

  // ---------- actions ----------
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-persona]');
    if (b) { S.persona = b.dataset.persona; S.ui.picker = false; S.ui.confirm = null; S.ui.formError = null; S.ui.flash = null; S.ui.newConvoError = null; render(); return; }
    var t = e.target.closest('[data-act]'); if (!t || t.tagName === 'INPUT') return;
    var act = t.dataset.act, gid = t.dataset.gid, pid = t.dataset.pid, g = gid ? group(gid) : null;
    if (act === 'sendanother') { S.ui.sent = null; S.ui.newConvoError = null; render(); }
    else if (act === 'picker') { S.ui.picker = !S.ui.picker; S.ui.pickQuery = ''; S.ui.confirm = null; S.ui.pickerFocus = S.ui.picker; render(); }
    else if (act === 'confirm') { S.ui.confirm = { gid: gid, pid: pid }; S.ui.picker = false; render(); }
    else if (act === 'cancel') { S.ui.confirm = null; render(); }
    else if (act === 'add') {
      S.ui.busy = 'add:' + gid + ':' + pid; render();
      simulate(function () {
        join(g, pid, me());
        S.ui.busy = null; S.ui.pickerFocus = true;
        S.ui.flash = { kind: 'success', text: esc(PEOPLE[pid].name) + ' is now in ' + esc(g.name) + '. We’ve emailed them a link to it.' };
      });
    }
    else if (act === 'addself') {
      S.ui.busy = 'self:' + gid; render();
      simulate(function () {
        S.ui.busy = null;
        join(g, me().id, me());
        S.ui.flash = { kind: 'success', text: 'You’re in ' + esc(g.name) + ' now. You’ll get its emails from here on, and you can read everything already in it — we’ve emailed you a link.' };
      });
    }
    else if (act === 'remove') {
      S.ui.busy = 'rm:' + gid + ':' + pid; render();
      simulate(function () {
        S.ui.busy = null; var you = pid === me().id, name = PEOPLE[pid].name;
        g.members = g.members.filter(function (x) { return x !== pid; });
        S.ui.confirm = null;
        S.ui.flash = { kind: 'info', text: you ? 'You’re no longer in ' + esc(g.name) + '. You still belong to ' + CLUB.name + '.' : esc(name) + ' is no longer in ' + esc(g.name) + '. They still belong to ' + CLUB.name + '.' };
        if (you && !me().admin) go('g/' + g.id);
      });
    }
    else if (act === 'request') {
      var key = gid + ':' + S.persona; S.ui.request[key] = 'sending'; render();

        S.ui.request[key] = 'sent';
        var m = me(), link = '#/g/' + g.id + '/members', url = CLUB.host + '/groups/' + g.id + '/members';
        var text = m.name + ' would like to join ' + g.name + '.\n\n' + m.name.split(' ')[0] + ' is an active member of ' + CLUB.name + ' and asked from ' + g.name + '’s page. Any ' + g.name + ' member or club admin can add them — open ' + g.name + '’s members and choose Add member:\n' + url + '\n\nMemba sent this when ' + m.name.split(' ')[0] + ' pressed Request access. ' + m.name.split(' ')[0] + ' isn’t in Admin, so they can’t see this conversation or any replies to it.';
        S.convos.unshift({ id: uid('req'), group: 'admin', subject: 'Access request: ' + g.name, body: text.split('\n')[0] + ' ' + text.split('\n')[2], from: m.id, date: 'just now', replies: [], auto: g.id, html: esc(text).replace(esc(url), '<a href="' + link + '">' + esc(url) + '</a>') });
        S.outbox.push({ kind: 'group message (existing member-message email)', to: 'Admin members (Alice, Dan)', from: CLUB.name + ' via Memba', subject: '[' + CLUB.slug + '] Access request: ' + g.name, body: text, link: '#/g/admin', linkText: 'Open in Admin' });
      });
    }
  });

  function join(g, pid, by) {
    if (isMember(g, pid)) return;
    g.members.push(pid); S.ui.justAdded = { gid: g.id, pid: pid };
    var p = PEOPLE[pid], self = pid === by.id;
    S.outbox.push({ kind: 'welcome email (emails/group-welcome.html)', to: p.email, from: CLUB.name + ' via Memba', subject: '[' + CLUB.slug + '] You’ve been added to ' + g.name, body: 'Hi ' + p.name.split(' ')[0] + ',\n' + (self ? 'You added yourself to ' : by.name + ' added you to ') + g.name + ', a private group inside ' + CLUB.name + '. As a ' + g.name + ' member you can read everything already in it and you’ll get its emails from now on.\nEarlier ' + g.name + ' emails aren’t resent — the full history is on the website.\nOpen ' + g.name + ': ' + CLUB.host + '/groups/' + g.id, link: '#/g/' + g.id, linkText: 'Open ' + g.name });
  }

  document.addEventListener('input', function (e) {
    if (e.target.dataset.act === 'pickq') { S.ui.pickQuery = e.target.value; S.ui.pickerFocus = true; render(); }

  });

  document.addEventListener('submit', function (e) {

        var g = { id: uid('g'), name: c.trimmed, slug: c.slug, system: false, members: [me().id] };
        S.groups.push(g); S.ui.busy = null; S.ui.formName = ''; S.ui.formTouched = false;
        S.ui.flash = { kind: 'success', text: esc(g.name) + ' created. You’re its first member — add people below, or email <strong>' + address(g) + '</strong> to start a conversation.' + (c.slug !== c.base ? ' “' + c.base + '” was already taken, so its address uses <strong>' + c.slug + '</strong>.' : '') };
        go('g/' + g.id + '/members');
      });
    }
    if (e.target.id === 'composeForm') {
      var gid = route().gid, g = group(gid), sub = e.target.subject.value.trim(), body = e.target.body.value.trim();
      S.ui.newConvoError = (!sub || !body) ? 'Give the message a subject and some text.' : null;
      if (S.ui.newConvoError) { render(); return; }
      S.ui.busy = 'compose'; render();
      simulate(function () {
        S.ui.busy = null;
        var cid = uid('c');
        S.convos.unshift({ id: cid, group: gid, subject: sub, body: body, from: me().id, date: 'just now', replies: [] });
        S.outbox.push({ kind: 'group message (existing member-message email)', to: g.name + ' members (' + g.members.map(function (p) { return PEOPLE[p].name.split(' ')[0]; }).join(', ') + ')', from: CLUB.name + ' via Memba', subject: '[' + CLUB.slug + '] ' + sub, body: body });
        S.ui.sent = { gid: gid, cid: cid }; // "being sent", not proof of delivery
      });
    }
    if (e.target.id === 'replyForm') {
      var cid = e.target.dataset.cid, text = e.target.text.value.trim(), c = null; S.convos.forEach(function (x) { if (x.id === cid) c = x; });
      S.ui.newConvoError = text ? null : 'Your reply can’t be blank.';
      if (S.ui.newConvoError) { render(); return; }
      c.replies.push({ from: me().id, text: text, time: 'just now' }); S.ui.newConvoError = null;
      S.outbox.push({ kind: 'reply notification (existing reply email)', to: 'followers in ' + group(c.group).name, from: CLUB.name + ' via Memba', subject: '[' + CLUB.slug + '] Re: ' + c.subject, body: text });
      render();
    }
  });

  // Roving-tabindex keyboard navigation, as in the .SectionTabs colocated hook (e6d3c38de).
  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    var list = e.target.closest && e.target.closest('[role="tablist"]'); if (!list) return;
    var tabs = Array.prototype.slice.call(list.querySelectorAll('[role="tab"]')), i = tabs.indexOf(e.target); if (i === -1) return;
    var n;
    if (e.key === 'ArrowRight') n = (i + 1) % tabs.length;
    else if (e.key === 'ArrowLeft') n = (i - 1 + tabs.length) % tabs.length;
    else if (e.key === 'Home') n = 0;
    else if (e.key === 'End') n = tabs.length - 1;
    else return;
    e.preventDefault(); S.ui.focusTab = tabs[n].dataset.tab; tabs[n].click();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && (S.ui.picker || S.ui.confirm)) { S.ui.picker = false; S.ui.confirm = null; render(); var b = document.querySelector('[data-act="picker"]'); if (b) b.focus(); } });

  if (!location.hash) location.replace('#/g/board');
  render();
})();
</script>
</body>
