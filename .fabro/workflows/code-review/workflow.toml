_version = 1

[workflow]
graph = "workflow.fabro"

[run]
goal = "Review an already-published implementation and produce clean, bounded-heal, durable-record, or consequential-human routing without gating delivery"

[run.environment]
id = "memba-dev"

[run.checkpoint]
exclude_globs = [".fabro/tmp", ".fabro/tmp/**"]

[environments.memba-dev]
provider = "docker"

[environments.memba-dev.resources]
cpu = 1
memory = "2048MB"

[environments.memba-dev.image]
docker = "ghcr.io/mattwynne/memba-fabro-dev:latest"

[run.inputs]
plan_path = "docs/iterations/NNN-topic/plan.md"
base_sha = ""

[[run.prepare.steps]]
command = ["bash", "/workspace/memba/.fabro/workflows/code-review/prepare_mix.sh"]
