_version = 1

[workflow]
graph = "workflow.fabro"

[run]
goal = "Smoke-test Fabro-managed clone and branch metadata"
[run.environment]
id = "memba-dev"

[environments.memba-dev]
provider = "docker"

[environments.memba-dev.image]
ref = "ghcr.io/mattwynne/memba-fabro-dev:latest"

[environments.memba-dev.resources]
cpu = 4
memory = "8GB"

[run.pull_request]
enabled = true
draft = true
