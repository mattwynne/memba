_version = 1

[workflow]
graph = "workflow.fabro"

[run]
goal = "Review a completed iteration implementation against plan, ADRs, and independent reviewers"

[run.environment]
id = "memba-dev"

[environments.memba-dev]
provider = "docker"

[environments.memba-dev.image]
ref = "ghcr.io/mattwynne/memba-fabro-dev:latest"

[run.inputs]
plan_path = "docs/iterations/NNN-topic/plan.md"
base_ref = ""

[[run.prepare.steps]]
command = ["bash", "/workspace/memba/.fabro/workflows/iteration-review/prepare_mix.sh"]

[run.pull_request]
enabled = true
draft = false
auto_merge = true
merge_strategy = "squash"
