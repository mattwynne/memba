_version = 1

[workflow]
graph = "workflow.fabro"

[run.model]
provider = "openai"
name = "gpt-5.6-sol"
fallbacks = { "gpt-5.6-sol" = [] }

[run.model.controls]
reasoning_effort = "high"

# The existing iteration plan is the seed; exactly one domain scenario is @wip.
[run.inputs]
plan = ""

[run.environment]
id = "memba-dev"

[environments.memba-dev]
provider = "docker"

[environments.memba-dev.image]
docker = "ghcr.io/mattwynne/memba-fabro-dev:sha-84bdc8e6f02e34bd573b35ebc2102319fc5bd9da-run-39652594216-1"

[environments.memba-dev.network]
mode = "allow_all"

[environments.memba-dev.lifecycle]
preserve = true
stop_on_terminal = true

[run.agent]
fabro_tools = false

[run.integrations.github]
permissions = {}

[run.checkpoint]
exclude_globs = [".fabro/tmp/**", ".fabro/blobs/**"]

[run.artifacts]
include = [".fabro/tmp/bdd/**"]
