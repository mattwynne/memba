_version = 1

[workflow]
graph = "workflow.fabro"

[run]
goal = "Validate, implement, review, and mark one ready iteration as delivered"

[run.agent]
fabro_tools = true

[run.inputs]
plan_path = "docs/iterations/NNN-topic/plan.md"
# deliver: validate, reserve implementation WIP, implement, review, finalize.
# validate_only: validate the plan and stop before reserving implementation WIP.
mode = "deliver"
