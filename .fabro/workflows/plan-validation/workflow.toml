_version = 1

[workflow]
graph = "workflow.fabro"

[run]
goal = "Validate that an iteration plan is ready for implementation and mark it validated without starting implementation"

# Publication runs bin/dev check before attesting and pushing the candidate.
# Fabro's default buildpack-deps image does not include devenv.
[run.environment]
id = "memba-dev"

[environments.memba-dev]
provider = "docker"

[environments.memba-dev.image]
docker = "ghcr.io/mattwynne/memba-fabro-dev:sha-84bdc8e6f02e34bd573b35ebc2102319fc5bd9da-run-39652594216-1"

[run.inputs]
plan_path = "docs/strategy/iteration-plan.md"
# Set to false for eval/test runs so the real workflow can prove routing without
# committing and pushing fixture plans.
publish = "true"
