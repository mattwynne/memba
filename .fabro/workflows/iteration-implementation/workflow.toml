_version = 1

[workflow]
graph = "workflow.fabro"

[run]
goal = "Implement a validated iteration plan and leave the codebase passing dev check"
working_dir = "/workspace/memba"

[run.environment]
id = "memba-dev"

[environments.memba-dev]
provider = "docker"

[environments.memba-dev.image]
ref = "ghcr.io/mattwynne/memba-fabro-dev:latest"

[environments.memba-dev.resources]
cpu = 4
memory = "8GB"

[run.inputs]
plan_path = "docs/iterations/NNN-topic/plan.md"

[run.clone]
enabled = false

[[run.prepare.steps]]
command = ["mkdir", "-p", "/repos/mattwynne", "/workspace"]

[[run.prepare.steps]]
command = ["git", "clone", "--branch", "main", "--single-branch", "--depth", "10", "--no-tags", "https://github.com/mattwynne/memba", "/repos/mattwynne/memba"]

[[run.prepare.steps]]
command = ["ln", "-s", "/repos/mattwynne/memba", "/workspace/memba"]

[[run.prepare.steps]]
command = ["git", "-C", "/workspace/memba", "config", "user.email", "fabro@example.invalid"]

[[run.prepare.steps]]
command = ["git", "-C", "/workspace/memba", "config", "user.name", "Fabro"]

[run.pull_request]
enabled = true
draft = false
auto_merge = true
merge_strategy = "squash"
