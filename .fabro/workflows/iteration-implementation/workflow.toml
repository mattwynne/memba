_version = 1

[workflow]
graph = "workflow.fabro"

[run]
goal = "Implement a validated iteration plan and leave the codebase passing dev check"

[run.environment]
id = "memba-dev"

[environments.memba-dev]
provider = "docker"

[environments.memba-dev.image]
ref = "ghcr.io/mattwynne/memba-fabro-dev:latest"

[run.inputs]
plan_path = "docs/iterations/NNN-topic/plan.md"

[[run.prepare.steps]]
command = ["bash", "/workspace/memba/.fabro/workflows/iteration-implementation/prepare_mix.sh"]

[run.pull_request]
enabled = true
draft = false
auto_merge = true
merge_strategy = "squash"
