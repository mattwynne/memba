<!-- @screen-label "Email templates" -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Memba — email templates</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../app/colors_and_type.css">
  <style>
    body { margin: 0; background: var(--canvas); font-family: var(--font-sans); color: var(--ink); }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 56px 32px 96px; }
    .head { margin-bottom: 40px; }
    .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg3); }
    h1 { font-size: 40px; letter-spacing: -0.032em; margin: 8px 0 10px; }
    .lede { font-size: 17px; color: var(--fg2); max-width: 640px; line-height: 1.5; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
    @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
    .col__label { font-size: 13px; font-weight: 600; color: var(--fg2); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .col__label .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--forest-500); }
    .frame { background: #ece9e0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-sm); }
    iframe { width: 100%; height: 720px; border: 0; display: block; }
    .back { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--forest-500); text-decoration: none; margin-bottom: 28px; }
    .back:hover { color: var(--forest-700); }
  </style>
</head>
<body data-screen-label="Email templates">
  <div class="wrap">
    <a class="back" href="../index.html">← Memba tour</a>
    <div class="head">
      <div class="eyebrow">Email templates</div>
      <h1>What lands in members' inboxes</h1>
      <p class="lede">Plain, warm, and unhurried — the same voice as the app. Renewal reminders, trip confirmations, and a welcome note, all sent through Memba.</p>
    </div>
    <div class="grid">
      <div>
        <div class="col__label"><span class="dot"></span>Renewal reminder</div>
        <div class="frame"><iframe src="renewal-reminder.html" title="Renewal reminder"></iframe></div>
      </div>
      <div>
        <div class="col__label"><span class="dot"></span>Trip confirmation</div>
        <div class="frame"><iframe src="event-confirmation.html" title="Trip confirmation"></iframe></div>
      </div>
      <div>
        <div class="col__label"><span class="dot"></span>Welcome</div>
        <div class="frame"><iframe src="welcome.html" title="Welcome"></iframe></div>
      </div>
    </div>
  </div>
</body>
</html>
