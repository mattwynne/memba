<!-- @screen-label "Logo — responsive sprig" -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Memba — responsive sprig</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --sage:#5a7050; --cream:#f6f5ea; --apricot:#d2925a; --ink:#25291d; --ink2:#555a47; --ink3:#878b76; --line:#e8e6d4; --paper:#fffef9; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: var(--cream); font-family: 'Figtree', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
    .page { max-width: 1080px; margin: 0 auto; padding: 56px 40px 96px; }
    .page > h1 { font-size: 38px; font-weight: 600; letter-spacing: -0.025em; margin: 0 0 8px; }
    .page > p.sub { font-size: 16px; color: var(--ink2); margin: 0 0 40px; max-width: 740px; line-height: 1.55; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .block { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
    .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink3); margin: 0 0 4px; }
    .cap { font-size: 13px; color: var(--ink3); margin: 4px 0 0; }
    .weight { text-align: center; }
    .weight .hero { display: grid; place-items: center; padding: 22px 0 16px; }
    .weight h3 { margin: 0; font-size: 18px; font-weight: 600; }
    .rule { display: inline-block; margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--sage); background: #eef1e6; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }

    .cross { display: flex; align-items: flex-end; justify-content: center; gap: 22px; padding: 8px 0 4px; }
    .rung { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .rung .px { font-size: 11px; color: var(--ink3); }
    .divider { align-self: stretch; width: 1px; background: var(--line); margin: 0 6px; position: relative; }
    .crosslabels { display: flex; justify-content: center; gap: 200px; margin-top: 14px; }
    .crosslabels span { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink3); }

    .swatchrow { display: flex; align-items: center; gap: 26px; flex-wrap: wrap; }
    .swatch { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .swatch .lab { font-size: 12px; color: var(--ink3); }
    .onwhite { width: 64px; height: 64px; border:1px solid var(--line); border-radius: 10px; display:grid; place-items:center; background: var(--paper); }
    .onsage { width: 64px; height: 64px; border-radius: 14px; display:grid; place-items:center; background: var(--sage); }

    .nav { display: flex; align-items: center; justify-content: space-between; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 13px 18px; }
    .nav__brand { display: flex; align-items: center; gap: 10px; }
    .nav__brand .wm { font-size: 21px; font-weight: 600; letter-spacing: -0.02em; }
    .nav__links { display: flex; align-items: center; gap: 16px; }
    .nav__links a { font-size: 14px; color: var(--ink2); text-decoration: none; white-space: nowrap; }
    .nav__btn { background: var(--sage); color: var(--cream); border: none; font-family: inherit; font-size: 14px; font-weight: 600; padding: 9px 15px; border-radius: 6px; white-space: nowrap; }

    .tab { display: inline-flex; align-items: center; gap: 8px; background: var(--paper); border: 1px solid var(--line); border-bottom: none; border-radius: 9px 9px 0 0; padding: 9px 14px 11px; font-size: 13px; color: var(--ink2); }
    .appicons { display: flex; align-items: flex-end; gap: 18px; }

    .reco { background: #eef1e6; border: 1px solid #dde3cf; border-radius: 12px; padding: 20px 24px; font-size: 15px; line-height: 1.6; color: var(--ink2); }
    .reco b { color: var(--ink); font-weight: 600; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="logos.jsx"></script>

  <script type="text/babel">
    const SAGE = '#5a7050', CREAM = '#f6f5ea', APRICOT = '#d2925a';

    function App() {
      return (
        <div className="page">
          <h1>A responsive sprig</h1>
          <p className="sub">You keep the line sprig — it just <b style={{color:'var(--ink)'}}>solidifies</b> as it gets small. The outline carries the refined, iconographic feel at display sizes; below ~24px the same silhouette fills in and thickens its stem so it never thins out or closes up. One mark, two weights.</p>

          {/* two weights */}
          <div className="grid2">
            <div className="block weight">
              <p className="eyebrow">Display weight</p>
              <div className="hero"><Mark kind="lineSprig" size={108} /></div>
              <h3>Line sprig</h3>
              <div><span className="rule">28px and up</span></div>
            </div>
            <div className="block weight">
              <p className="eyebrow">Small weight</p>
              <div className="hero"><Mark kind="sprigSolid" size={108} /></div>
              <h3>Solid sprig</h3>
              <div><span className="rule">24px and down</span></div>
            </div>
          </div>

          {/* crossover */}
          <div className="block">
            <p className="eyebrow">The crossover</p>
            <p className="cap" style={{marginBottom:18}}>Same silhouette the whole way down — outline on the left, solid on the right.</p>
            <div className="cross">
              {[48,32,28].map(s => <div className="rung" key={s}><Mark kind="lineSprig" size={s} /><span className="px">{s}px</span></div>)}
              <div className="divider"></div>
              {[24,20,16].map(s => <div className="rung" key={s}><Mark kind="sprigSolid" size={s} /><span className="px">{s}px</span></div>)}
            </div>
            <div className="crosslabels"><span>Outline</span><span>Solid</span></div>
          </div>

          {/* 16px proof */}
          <div className="block">
            <p className="eyebrow">At 16px — favicon &amp; tab</p>
            <p className="cap" style={{marginBottom:18}}>What you'd otherwise lose to thin strokes, the solid keeps.</p>
            <div className="swatchrow">
              <div className="swatch"><div className="onwhite"><Mark kind="lineSprig" size={16} /></div><span className="lab">line · 16px</span></div>
              <div className="swatch"><div className="onwhite"><Mark kind="sprigSolid" size={16} /></div><span className="lab">solid · 16px</span></div>
              <div className="swatch"><div className="onsage"><Mark kind="lineSprig" size={16} c={CREAM} d={SAGE} a={APRICOT} /></div><span className="lab">line on sage</span></div>
              <div className="swatch"><div className="onsage"><Mark kind="sprigSolid" size={16} c={CREAM} d={SAGE} a={APRICOT} /></div><span className="lab">solid on sage</span></div>
              <div className="swatch"><div className="tab"><Mark kind="sprigSolid" size={16} /> memba</div><span className="lab">browser tab</span></div>
            </div>
          </div>

          {/* in context */}
          <div className="grid2">
            <div className="block">
              <p className="eyebrow">In the nav — line</p>
              <div className="nav" style={{marginTop:14}}>
                <div className="nav__brand"><Mark kind="lineSprig" size={26} /><span className="wm">memba</span></div>
                <div className="nav__links"><a href="#">Trips</a><a href="#">Members</a><button className="nav__btn">Sign in</button></div>
              </div>
            </div>
            <div className="block">
              <p className="eyebrow">App icon &amp; favicon — solid</p>
              <div className="appicons" style={{marginTop:14}}>
                <div className="onsage" style={{width:72,height:72,borderRadius:16}}><Mark kind="sprigSolid" size={52} c={CREAM} d={SAGE} a={APRICOT} /></div>
                <div className="onsage" style={{width:40,height:40,borderRadius:9}}><Mark kind="sprigSolid" size={30} c={CREAM} d={SAGE} a={APRICOT} /></div>
                <div className="onsage" style={{width:24,height:24,borderRadius:6}}><Mark kind="sprigSolid" size={18} c={CREAM} d={SAGE} a={APRICOT} /></div>
              </div>
            </div>
          </div>

          <div className="reco">
            <b>The rule:</b> line sprig at 28px and above (nav, marketing, headers, large lockups); solid sprig at 24px and below (favicon, app icon, dense table rows, browser tab). Both share the exact same outline, so switching between them is invisible to the eye — it just always looks crisp.
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
