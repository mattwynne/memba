<!-- @screen-label "Marketing — Home" -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Memba — a small, friendly membership system for clubs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="../brand/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="site.css">
</head>
<body data-screen-label="Marketing — Home">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="Features.jsx"></script>
  <script type="text/babel" src="Quote.jsx"></script>
  <script type="text/babel" src="Pricing.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel" src="SignupModal.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "tightenCopy": true,
      "thingsShown": "three",
      "showPricing": true,
      "showQuote": true,
      "showStats": true,
      "singleCta": false,
      "minimalNav": false,
      "roominess": 0.85
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [signup, setSignup] = React.useState(false);
      const open = () => setSignup(true);
      const close = () => setSignup(false);
      return (
        <div style={{ '--room': t.roominess }}>
          <Nav onCTA={open} minimal={t.minimalNav} />
          <Hero
            onCTA={open}
            tight={t.tightenCopy}
            singleCta={t.singleCta}
            showMeta={t.showStats}
          />
          <Features tight={t.tightenCopy} count={t.thingsShown} />
          {t.showQuote && <Quote />}
          {t.showPricing && <Pricing onCTA={open} />}
          <Footer />
          <SignupModal open={signup} onClose={close} />

          <TweaksPanel>
            <TweakSection label="Strip it back" />
            <TweakToggle
              label="Tighten the copy"
              value={t.tightenCopy}
              onChange={(v) => setTweak('tightenCopy', v)}
            />
            <TweakRadio
              label="Things shown"
              value={t.thingsShown}
              options={['one', 'three']}
              onChange={(v) => setTweak('thingsShown', v)}
            />
            <TweakToggle
              label="Pricing section"
              value={t.showPricing}
              onChange={(v) => setTweak('showPricing', v)}
            />
            <TweakToggle
              label="Customer quote"
              value={t.showQuote}
              onChange={(v) => setTweak('showQuote', v)}
            />
            <TweakToggle
              label="Stat line"
              value={t.showStats}
              onChange={(v) => setTweak('showStats', v)}
            />

            <TweakSection label="Calm & space" />
            <TweakToggle
              label="One call to action"
              value={t.singleCta}
              onChange={(v) => setTweak('singleCta', v)}
            />
            <TweakToggle
              label="Minimal nav"
              value={t.minimalNav}
              onChange={(v) => setTweak('minimalNav', v)}
            />
            <TweakSlider
              label="Breathing room"
              value={t.roominess}
              min={0.7}
              max={1.5}
              step={0.05}
              unit="×"
              onChange={(v) => setTweak('roominess', v)}
            />
          </TweaksPanel>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
