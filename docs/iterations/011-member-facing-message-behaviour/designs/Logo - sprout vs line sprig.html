<!-- @screen-label "Logo — sprout vs line sprig" -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Memba — sprout vs line sprig</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --sage:#5a7050; --cream:#f6f5ea; --apricot:#d2925a; --ink:#25291d; --ink2:#555a47; --ink3:#878b76; --line:#e8e6d4; --paper:#fffef9; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: var(--cream); font-family: 'Figtree', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
    .page { max-width: 1180px; margin: 0 auto; padding: 56px 40px 96px; }
    .page > h1 { font-size: 38px; font-weight: 600; letter-spacing: -0.025em; margin: 0 0 8px; }
    .page > p.sub { font-size: 16px; color: var(--ink2); margin: 0 0 44px; max-width: 720px; line-height: 1.5; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: start; }
    .col { display: flex; flex-direction: column; gap: 20px; }
    .col__name { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
    .col__note { font-size: 14px; color: var(--ink2); margin: 4px 0 0; line-height: 1.5; }
    .block { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 22px; }
    .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink3); margin: 0 0 16px; }
    .hero { display: grid; place-items: center; padding: 30px 0; }
    .lockup { display: flex; align-items: center; gap: 14px; }
    .lockup .wm { font-size: 38px; font-weight: 600; letter-spacing: -0.02em; }
    .ladder { display: flex; align-items: flex-end; gap: 26px; }
    .ladder .rung { display: flex; flex-direction: column; align-items: center; gap: 9px; }
    .ladder .px { font-size: 11px; color: var(--ink3); }
    .icons { display: flex; align-items: flex-end; gap: 18px; }
    .appicon { background: var(--sage); display: grid; place-items: center; }
    .nav { display: flex; align-items: center; justify-content: space-between; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 13px 18px; }
    .nav__brand { display: flex; align-items: center; gap: 10px; }
    .nav__brand .wm { font-size: 21px; font-weight: 600; letter-spacing: -0.02em; }
    .nav__links { display: flex; align-items: center; gap: 16px; }
    .nav__links a { font-size: 14px; color: var(--ink2); text-decoration: none; white-space: nowrap; }
    .nav__btn { background: var(--sage); color: var(--cream); border: none; font-family: inherit; font-size: 14px; font-weight: 600; padding: 9px 15px; border-radius: 6px; white-space: nowrap; }
    .reversed { background: var(--sage); border: none; }
    .reversed .eyebrow { color: rgba(255,255,255,0.55); }
    .reversed .wm { color: var(--cream); font-size: 34px; font-weight: 600; letter-spacing: -0.02em; }
    .reco { margin-top: 40px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 22px 24px; font-size: 15px; line-height: 1.6; color: var(--ink2); }
    .reco b { color: var(--ink); font-weight: 600; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="logos.jsx"></script>

  <script type="text/babel">
    const SAGE = '#5a7050', CREAM = '#f6f5ea', APRICOT = '#d2925a';

    function Column({ kind, name, note }) {
      const appSizes = [[72, 16], [40, 9], [24, 5]];
      return (
        <div className="col">
          <div>
            <h2 className="col__name">{name}</h2>
            <p className="col__note">{note}</p>
          </div>

          <div className="block">
            <p className="eyebrow">The mark</p>
            <div className="hero"><Mark kind={kind} size={104} /></div>
          </div>

          <div className="block">
            <p className="eyebrow">Lockup</p>
            <div className="lockup"><Mark kind={kind} size={44} /><span className="wm">memba</span></div>
          </div>

          <div className="block">
            <p className="eyebrow">At size — does it survive?</p>
            <div className="ladder">
              {[48, 32, 24, 16].map((s) => (
                <div className="rung" key={s}><Mark kind={kind} size={s} /><span className="px">{s}px</span></div>
              ))}
            </div>
          </div>

          <div className="block">
            <p className="eyebrow">App icon</p>
            <div className="icons">
              {appSizes.map(([s, r]) => (
                <div className="appicon" key={s} style={{ width: s, height: s, borderRadius: r }}>
                  <Mark kind={kind} size={Math.round(s * 0.74)} c={CREAM} d={SAGE} a={APRICOT} />
                </div>
              ))}
            </div>
          </div>

          <div className="nav">
            <div className="nav__brand"><Mark kind={kind} size={26} /><span className="wm">memba</span></div>
            <div className="nav__links">
              <a href="#">Trips</a><a href="#">Members</a>
              <button className="nav__btn">Sign in</button>
            </div>
          </div>

          <div className="block reversed">
            <p className="eyebrow">Reversed</p>
            <div className="lockup"><Mark kind={kind} size={40} c={CREAM} d={SAGE} a={APRICOT} /><span className="wm">memba</span></div>
          </div>
        </div>
      );
    }

    function App() {
      return (
        <div className="page">
          <h1>Sprout vs line sprig</h1>
          <p className="sub">The two finalists in the places that decide it — at small sizes, as an app icon on sage, in the nav, and reversed.</p>
          <div className="cols">
            <Column kind="sprout" name="Sprout" note="Solid, filled. Two cotyledon leaves, bud between." />
            <Column kind="lineSprig" name="Line sprig" note="Outline. The seedling drawn to match the line iconography." />
          </div>
          <div className="reco">
            <b>My read:</b> the <b>sprout</b> holds its shape all the way down to 16px and makes the strongest app icon — which matters for an iPad home screen and a browser tab. The <b>line sprig</b> is more refined and sits beautifully beside Memba's line icons at larger sizes, but its thin strokes start to thin out and close up around 16–20px. If the favicon and app icon matter most, sprout; if the mark mostly appears large, line sprig.
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
