<!-- @screen-label "Logo — leaf & card" -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Memba — leaf & card</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="logos.jsx"></script>

  <script type="text/babel">
    const CONCEPTS = [
      { kind: 'sprig', name: 'Sprig', note: 'The leaf, worked up. A two-leaf sprig with an apricot bud — open and growing. Reads at any size.' },
      { kind: 'sprigSquare', name: 'Sprig in the square', note: 'Same sprig set in the brand square, so the app icon and favicon stay solid and legible.' },
      { kind: 'cardSprig', name: 'Card + sprig', note: 'The synthesis: a membership card with a sprig growing from it. Belonging that grows.' },
      { kind: 'cardLeaf', name: 'Card + leaf', note: 'A lighter take — the plain dot becomes a single apricot leaf. Keeps the card calm but warmer.' },
    ];
    function App() {
      return (
        <DesignCanvas>
          <DCSection
            id="leafcard"
            title="The leaf, and the card warmed up"
            subtitle="The sprig developed properly, plus two ways to bring the leaf into the membership card you liked.">
            {CONCEPTS.map((concept) => (
              <DCArtboard key={concept.kind} id={concept.kind} label={concept.name} width={520} height={520}>
                <LogoTile concept={concept} />
              </DCArtboard>
            ))}
          </DCSection>
        </DesignCanvas>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
