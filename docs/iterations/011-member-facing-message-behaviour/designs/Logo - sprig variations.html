<!-- @screen-label "Logo — sprig variations" -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Memba — sprig variations</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="logos.jsx"></script>

  <script type="text/babel">
    const VARIATIONS = [
      { kind: 'seedling', name: 'Seedling', note: 'The original, refined — two leaves alternating up a tall stem with the bud on top.' },
      { kind: 'sprig3', name: 'Three-leaf', note: 'A fuller sprig — three leaves climbing the stem. Reads as more established growth.' },
      { kind: 'sprout', name: 'Sprout', note: 'Just broken ground — two cotyledon leaves spreading low, bud between. Compact, best at tiny sizes.' },
      { kind: 'pair', name: 'Open pair', note: 'Two symmetrical leaves, balanced like wings. The most iconic and stable of the set.' },
      { kind: 'leafVein', name: 'Single leaf', note: 'One bold leaf with an apricot midrib carrying the accent. The simplest, most legible mark.' },
      { kind: 'lineSprig', name: 'Line sprig', note: 'The seedling drawn in outline — lighter and more delicate, closer to the line iconography.' },
    ].map((v) => ({ ...v, casing: 'lower' }));

    function App() {
      return (
        <DesignCanvas>
          <DCSection
            id="sprigs"
            title="Variations on the sprig"
            subtitle="Six takes on the leaf — leaf count, symmetry, fill vs line. All lowercase, all with the apricot bud, shown large, reversed on sage, and at 20px.">
            {VARIATIONS.map((concept) => (
              <DCArtboard key={concept.kind} id={concept.kind} label={concept.name} width={520} height={470}>
                <LogoTile concept={concept} />
              </DCArtboard>
            ))}
          </DCSection>
        </DesignCanvas>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
