<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Member Messaging — Wireframes</title>
<link rel="stylesheet" href="wireframes/wireframes.css" />
<style>
  html, body { margin: 0; height: 100%; background: #ece9e2; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="wireframes/icons.jsx"></script>
<script type="text/babel" src="wireframes/dashboard.jsx"></script>
<script type="text/babel" src="wireframes/compose.jsx"></script>
<script type="text/babel" src="wireframes/receipts.jsx"></script>

<script type="text/babel" data-presets="react">
  const W = 880;

  function App() {
    return (
      <DesignCanvas>
        <DCSection id="home" title="1 · Club home" subtitle="Where a signed-in member lands. Useful straight away — messages, members, one clear action.">
          <DCArtboard id="home-main" label="Member dashboard" width={W} height={1000}><Dashboard /></DCArtboard>
          <DCArtboard id="home-empty" label="Empty state · brand-new club" width={W} height={900}><DashboardEmpty /></DCArtboard>
        </DCSection>

        <DCSection id="compose" title="2 · Compose club message" subtitle="Calm and single-column. Any active member can write to the whole club.">
          <DCArtboard id="compose-main" label="Compose" width={W} height={900}><Compose /></DCArtboard>
          <DCArtboard id="compose-ok" label="Sent · confirmation" width={W} height={560}><ComposeSuccess /></DCArtboard>
          <DCArtboard id="compose-err" label="Couldn't send · error" width={W} height={560}><ComposeError /></DCArtboard>
        </DCSection>

        <DCSection id="receipts" title="3 · Message receipts" subtitle="Who got it, at a glance — a status bar and percentages up top, then break open each group to see exactly who.">
          <DCArtboard id="receipts-main" label="Message detail + receipts" width={W} height={1180}><Receipts /></DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
