name: Build Fabro dev image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - devenv.nix
      - devenv.lock
      - .github/workflows/fabro-dev-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: fabro-dev-image
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}

      - name: Use devenv binary cache
        uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Build devenv container
        run: devenv container build fabro-dev

      - name: Log in to GitHub Container Registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push devenv container to GHCR
        run: devenv container copy fabro-dev
