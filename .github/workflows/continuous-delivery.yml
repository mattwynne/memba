name: Continuous delivery

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuous-delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev-check:
    name: dev check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}

      - name: Use devenv binary cache
        uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Restore dependency caches
        uses: actions/cache@v4
        with:
          path: |
            /tmp/home/.hex
            /tmp/home/.mix
            /tmp/home/.npm
            web/deps
            web/_build
            acceptance-tests/node_modules
          key: ${{ runner.os }}-memba-dev-${{ hashFiles('devenv.lock', 'devenv.yaml', 'devenv.nix', 'web/mix.lock', 'acceptance-tests/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-memba-dev-

      - name: Run devenv test suite
        run: devenv test
        env:
          ACCEPTANCE_LOG_PROGRESS: "1"

  deploy:
    name: deploy to Fly.io
    runs-on: ubuntu-latest
    needs: dev-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: fly-deploy-production
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only --build-arg MEMBA_GIT_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
