<!-- @dsCard group="Components" viewport="700x144" name="Cards" subtitle="Content card and club card — the main container unit" -->
<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5">
  <style>
    :root{--color-sage-50:#eef1e6;--color-sage-100:#dde3cf;--color-sage-200:#bccaa6;--color-sage-300:#98ab80;--color-sage-400:#6f8760;--color-sage-500:#5a7050;--color-sage-600:#475a40;--color-sage-700:#36462f;--color-sage-800:#232e1e;--color-cream:#f6f5ea;--color-paper:#fffef9;--color-line:#e8e6d4;--color-line-strong:#d9d6bf;--color-ink:#25291d;--color-ink-2:#555a47;--color-ink-3:#878b76;--font-sans:'Figtree',ui-sans-serif,system-ui,sans-serif;--font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
    :root{color-scheme:light;--color-base-100:#fffef9;--color-base-200:#f6f5ea;--color-base-300:#e8e6d4;--color-base-content:#25291d;--color-primary:#5a7050;--color-primary-content:#f6f5ea;--color-secondary:#555a47;--color-secondary-content:#f6f5ea;--color-accent:#d2925a;--color-accent-content:#25291d;--color-neutral:#25291d;--color-neutral-content:#f6f5ea;--color-info:#4f6b78;--color-info-content:#f6f5ea;--color-success:#5f7a4f;--color-success-content:#f6f5ea;--color-warning:#a8772e;--color-warning-content:#f6f5ea;--color-error:#a8503a;--color-error-content:#f6f5ea;--radius-selector:.375rem;--radius-field:.375rem;--radius-box:.75rem;--size-selector:.25rem;--size-field:.25rem;--border:1px;--depth:0;--noise:0}
    body{font-family:var(--font-sans);color:var(--color-ink)}
    body { margin: 0; padding: 16px 20px; }
    .row { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
    .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--color-ink-3); margin-bottom: 6px; }
    /* Card container — plain CSS (daisyUI .card needs Tailwind utilities like bg-base-100 that
       can't be JIT'd in a static preview); reproduces the app's paper card on the cream canvas. */
    .ccard { background: var(--color-paper); border: 1px solid var(--color-line); border-radius: var(--radius-box); padding: 16px 18px; }
    .ccard h4 { margin: 0 0 4px; font-size: 16px; font-weight: 600; color: var(--color-ink); }
    .ccard p  { margin: 0; font-size: 13.5px; color: var(--color-ink-2); }
    .ccard .ccard__foot { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--color-line); display: flex; gap: 8px; }
    .av { width: 38px; height: 38px; border-radius: 999px; display: grid; place-items: center; font-size: 13px; font-weight: 600; color: var(--color-sage-800); flex: none; }
    .msg-card { background: var(--color-paper); border: 1px solid var(--color-line); border-radius: var(--radius-box); padding: 14px 16px; width: 280px; }
    .msg-card__head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .msg-card__meta { font-size: 12px; color: var(--color-ink-3); }
    .msg-card__body { font-size: 13.5px; color: var(--color-ink-2); line-height: 1.45; }
  </style>
</head>
<body>
  <div class="row">
    <div>
      <div class="lbl">.ccard — content card</div>
      <div class="ccard" style="width:240px">
        <h4>Got something to share?</h4>
        <p>Write once — every active member gets it.</p>
        <div class="ccard__foot">
          <button class="btn btn-primary btn-sm">New message</button>
          <button class="btn btn-ghost btn-sm">Archive</button>
        </div>
      </div>
    </div>
    <div>
      <div class="lbl">message card</div>
      <div class="msg-card">
        <div class="msg-card__head">
          <span class="av" style="background:var(--color-sage-200)">ES</span>
          <div>
            <div style="font-size:13.5px;font-weight:600;color:var(--color-ink)">Eira Sandhu</div>
            <div class="msg-card__meta">3 Jun · 142 delivered · 28 opened</div>
          </div>
        </div>
        <div class="msg-card__body">AGM is confirmed for Saturday 14th. Full agenda attached — see you there.</div>
      </div>
    </div>
  </div>
</body>
</html>
