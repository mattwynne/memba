<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buttons — daisyUI prebuilt CSS</title>

  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

  <!-- daisyUI component CSS, prebuilt — no Tailwind compiler in the page.
       Component rules ship statically; colours come from the vars we set below. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5">

  <style>
    /* The Memba theme as plain daisyUI CSS variables. Every value is copied
       from web/assets/css/app.css — daisyUI components read these directly. */
    :root {
      color-scheme: light;

      --color-base-100: #fffef9;
      --color-base-200: #f6f5ea;
      --color-base-300: #e8e6d4;
      --color-base-content: #25291d;

      --color-primary: #5a7050;
      --color-primary-content: #f6f5ea;
      --color-secondary: #555a47;
      --color-secondary-content: #f6f5ea;
      --color-accent: #d2925a;
      --color-accent-content: #25291d;
      --color-neutral: #25291d;
      --color-neutral-content: #f6f5ea;

      --color-info: #4f6b78;
      --color-info-content: #f6f5ea;
      --color-success: #5f7a4f;
      --color-success-content: #f6f5ea;
      --color-warning: #a8772e;
      --color-warning-content: #f6f5ea;
      --color-error: #a8503a;
      --color-error-content: #f6f5ea;

      --radius-selector: 0.375rem;
      --radius-field: 0.375rem;
      --radius-box: 0.75rem;
      --size-selector: 0.25rem;
      --size-field: 0.25rem;
      --border: 1px;
      --depth: 0;
      --noise: 0;

      --font-sans: "Figtree", ui-sans-serif, system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --color-ink-3: #878b76;
    }

    /* No Tailwind utilities here — plain CSS does the layout. */
    html, body { margin: 0; }
    body {
      background: var(--color-base-200);
      color: var(--color-base-content);
      font-family: var(--font-sans);
      padding: 20px;
      display: flex; flex-direction: column; gap: 12px;
      -webkit-font-smoothing: antialiased;
    }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--color-ink-3); width: 72px; flex: none; }
    .sep { height: 1px; background: var(--color-base-300); }
  </style>
</head>

<body>
  <div class="row">
    <span class="lbl">variants</span>
    <button class="btn btn-primary">Send message</button>
    <button class="btn btn-soft">Cancel</button>
    <button class="btn btn-ghost">Skip for now</button>
    <button class="btn btn-error">Delete member</button>
  </div>

  <div class="sep"></div>

  <div class="row">
    <span class="lbl">sizes</span>
    <button class="btn btn-primary btn-lg">Large CTA</button>
    <button class="btn btn-primary">Default</button>
    <button class="btn btn-primary btn-sm">Small</button>
    <button class="btn btn-primary btn-xs">Tiny</button>
  </div>

  <div class="sep"></div>

  <div class="row">
    <span class="lbl">states</span>
    <button class="btn btn-primary" disabled>Sending…</button>
    <button class="btn btn-outline">Outline</button>
    <button class="btn btn-primary btn-soft">Soft</button>
  </div>
</body>
</html>
