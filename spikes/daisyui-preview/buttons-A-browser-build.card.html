<!-- @dsCard group="Spike" viewport="760x200" name="Buttons (daisyUI · browser build)" subtitle="Tailwind v4 browser JIT + daisyUI plugin + Memba theme" -->
<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buttons — daisyUI browser build</title>

  <!-- Figtree / JetBrains Mono -->
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

  <!-- 1) Tailwind v4 browser build (JITs utilities + runs @plugin/@theme client-side) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- 2) daisyUI plugin + the Memba theme, copied VERBATIM from web/assets/css/app.css.
          This is the whole point: the preview consumes the app's real theme. -->
  <style type="text/tailwindcss">
    @plugin "daisyui";

    @plugin "daisyui/theme" {
      name: "light";
      default: true;
      prefersdark: false;
      color-scheme: "light";

      --color-base-100: #fffef9;   /* paper */
      --color-base-200: #f6f5ea;   /* cream */
      --color-base-300: #e8e6d4;   /* line */
      --color-base-content: #25291d; /* ink */

      --color-primary: #5a7050;            /* sage */
      --color-primary-content: #f6f5ea;
      --color-secondary: #555a47;
      --color-secondary-content: #f6f5ea;
      --color-accent: #d2925a;             /* apricot — status only */
      --color-accent-content: #25291d;
      --color-neutral: #25291d;
      --color-neutral-content: #f6f5ea;

      --color-info: #4f6b78;
      --color-info-content: #f6f5ea;
      --color-success: #5f7a4f;
      --color-success-content: #f6f5ea;
      --color-warning: #a8772e;
      --color-warning-content: #f6f5ea;
      --color-error: #a8503a;
      --color-error-content: #f6f5ea;

      --radius-selector: 0.375rem;
      --radius-field: 0.375rem;
      --radius-box: 0.75rem;
      --size-selector: 0.25rem;
      --size-field: 0.25rem;
      --border: 1px;
      --depth: 0;
      --noise: 0;
    }

    @theme {
      --color-sage-50: #eef1e6;
      --color-sage-100: #dde3cf;
      --color-sage-200: #bccaa6;
      --color-sage-300: #98ab80;
      --color-sage-400: #6f8760;
      --color-sage-500: #5a7050;
      --color-sage-600: #475a40;
      --color-sage-700: #36462f;
      --color-sage-800: #232e1e;
      --color-cream: #f6f5ea;
      --color-paper: #fffef9;
      --color-ink: #25291d;
      --color-ink-2: #555a47;
      --color-ink-3: #878b76;
      --color-line: #e8e6d4;
      --font-sans: "Figtree", ui-sans-serif, system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }
  </style>

  <style>
    .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--color-ink-3); width: 72px; flex: none; }
  </style>
</head>

<body class="font-sans bg-base-200 text-base-content m-0 p-5 flex flex-col gap-3">
  <div class="flex items-center gap-2 flex-wrap">
    <span class="lbl">variants</span>
    <button class="btn btn-primary">Send message</button>
    <button class="btn btn-soft">Cancel</button>
    <button class="btn btn-ghost">Skip for now</button>
    <button class="btn btn-error">Delete member</button>
  </div>

  <div class="h-px bg-base-300"></div>

  <div class="flex items-center gap-2 flex-wrap">
    <span class="lbl">sizes</span>
    <button class="btn btn-primary btn-lg">Large CTA</button>
    <button class="btn btn-primary">Default</button>
    <button class="btn btn-primary btn-sm">Small</button>
    <button class="btn btn-primary btn-xs">Tiny</button>
  </div>

  <div class="h-px bg-base-300"></div>

  <div class="flex items-center gap-2 flex-wrap">
    <span class="lbl">states</span>
    <button class="btn btn-primary" disabled>Sending…</button>
    <button class="btn btn-outline">Outline</button>
    <button class="btn btn-primary btn-soft">Soft</button>
  </div>
</body>
</html>
